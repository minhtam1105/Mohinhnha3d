<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #1a1a1c; padding: 12px; border-radius: 12px; margin: 0; overflow: hidden; }
  
  /* Chuyển tab sang trái để không bị nút Edit/Delete của Panoee che */
  .header-tabs { display: flex; justify-content: flex-start; gap: 8px; margin-bottom: 10px; padding-left: 4px; }
  .tab-btn { border: none; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }
  .tab-btn.active { background: #8b2323; color: #fff; }
  .tab-btn.inactive { background: #2c2c2e; color: #adadad; }
  
  .viewer-container { 
    background: radial-gradient(circle at center, #3d3d42 0%, #252529 55%, #161618 100%); 
    border-radius: 12px; 
    position: relative; 
    width: 100%; 
    height: 1000px; 
    overflow: hidden; 
  }
  
  model-viewer { width: 100%; height: 100%; background: transparent; }
  .hint-badge { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12); padding: 5px 16px; border-radius: 15px; font-size: 11px; color: #e5e5e5; pointer-events: none; }
</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
</head>
<body>
  <div class="header-tabs">
    <button class="tab-btn inactive">MÔ HÌNH 3D NHÀ</button>
  </div>
  <div class="viewer-container">
    <model-viewer 
      src="https://raw.githubusercontent.com/minhtam1105/Mohinhnha3d/main/interior%20room%203d%20model.glb" 
      alt="Mô hình 3D Nhà bà Thư" 
      auto-rotate 
      camera-controls 
      shadow-intensity="1.5"
      exposure="1.1">
    </model-viewer>
  </div>
</body>
</html>
